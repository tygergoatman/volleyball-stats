<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
        <title>Volleyball Stats</title>
        <meta name="description" content="Live volleyball scoring and stat capture." />
        <meta name="theme-color" content="#0f1115" />
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="./icons/icon-192.png" />
        <link rel="stylesheet" href="./css/app.css" />
    </head>
    <body>
        <header id="header" class="header"></header>
        <main id="view" class="view"></main>
        <!-- Controls that must stay reachable whatever the view is scrolled to.
             A grid row of its own, exactly like the tab bar below it — no
             sticky, no fixed. Empty on every tab but the court, where `:empty`
             collapses it to nothing. -->
        <div id="dock" class="dock"></div>
        <nav id="tabs" class="tabs" aria-label="Sections"></nav>
        <noscript>
            <p style="padding: 2rem; color: #e8ecf2">This app needs JavaScript enabled.</p>
        </noscript>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
